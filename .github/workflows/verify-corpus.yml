name: Verify corpus

# The code is stable; the corpus is the asset, and it decays on vendor
# timelines this repo does not control: an Actions syntax change, a deprecated
# Apps Script API, a Gmail filter revision. This runs against production on a
# schedule so a record that stops being true fails loudly instead of sitting
# published and wrong.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Corpus conformance
        run: node scripts/check-payloads.mjs

      - name: Agent surface parity against production
        run: ./scripts/agent-surface-check.sh https://automationsanonymous.com
